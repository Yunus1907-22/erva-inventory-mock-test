<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erva • Mock stok yönetimi</title>
<style>body{font:16px system-ui;background:#f5f3ec;color:#253a30;margin:0}main{max-width:760px;margin:50px auto;padding:24px}h1{font-size:36px}label{display:block;margin:20px 0}input,textarea,select{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #c5cbbb;border-radius:6px;background:white;font:inherit;margin-top:8px}button,a{display:inline-block;padding:12px 18px;margin:8px 8px 8px 0;border-radius:5px;border:0;background:#324c3d;color:white;font:inherit;text-decoration:none;cursor:pointer}small{color:#627060}#message{min-height:24px}.tag{font-size:12px;letter-spacing:2px}form{background:#fff;padding:24px;border-radius:12px}</style>
<main><p class="tag">UZAK MOCK VERİ SUNUCUSU</p><h1>Taş stok yönetimi</h1><p>Buradaki değişiklikler açık Erva sitesine otomatik yansır. Bu veriler test içindir.</p><a href="http://127.0.0.1:5173/stones" target="_blank" rel="noreferrer">Taş koleksiyonunu aç ↗</a>
<form id="form"><label>Yönetim anahtarı<input id="admin-token" type="password" autocomplete="off" placeholder="Render ortamında belirlediğin anahtar"></label><label>Taş seç<select id="stone"></select></label><label>Taş adı<input id="name" required maxlength="500"></label><label>Stok durumu<select id="status"><option value="In stock">Stokta</option><option value="Low stock">Az stok</option><option value="Out of stock">Tükendi</option></select></label><label>Açıklama<textarea id="description" rows="3" maxlength="4000"></textarea></label><label>Menşei<input id="origin" maxlength="500"></label><label>Ölçüler<input id="dimensions" maxlength="500"></label><label>Fotoğraf adresi<input id="image" maxlength="500"></label><small>Mevcut /images/... adresi veya HTTPS fotoğraf adresi.</small><p><button id="save" type="submit">Kaydet ve siteye yansıt</button><button id="reset" type="button">Test verisini sıfırla</button></p><p id="message" role="status"></p><small id="revision"></small></form></main>
<script>
let inventory;const $=id=>document.getElementById(id);const fields=['name','status','description','origin','dimensions','image'];
function showItem(){const item=inventory.stones.find(x=>x.id===$('stone').value);for(const key of fields)$(key).value=item[key]||'';}
function apply(next){const selected=$('stone').value;inventory=next;$('stone').replaceChildren(...next.stones.map(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name;return option;}));if(next.stones.some(x=>x.id===selected))$('stone').value=selected;showItem();$('revision').textContent='Sürüm '+next.revision+' · '+new Date(next.updatedAt).toLocaleString('tr-TR');}
async function request(url,method,body){const response=await fetch(url,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('admin-token').value},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
fetch('/api/stones').then(r=>r.json()).then(apply).catch(()=>{$('message').textContent='Sunucuya ulaşılamadı.';});
$('stone').onchange=showItem;
$('form').onsubmit=async event=>{event.preventDefault();$('save').disabled=true;try{apply(await request('/api/stones/'+encodeURIComponent($('stone').value),'PATCH',Object.fromEntries(fields.map(key=>[key,$(key).value]))));$('message').textContent='Değişiklik kaydedildi ve bağlı sitelere bildirildi.';}catch(error){$('message').textContent=error.message;}finally{$('save').disabled=false;}};
$('reset').onclick=async()=>{try{apply(await request('/api/reset','POST',{}));$('message').textContent='Test verileri başlangıca döndü.';}catch(error){$('message').textContent=error.message;}};
</script></html>
